version: '3.8'

services:
  user-service:
    build: ./user-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=app
    depends_on:
      - db

  tour-service:
    build: ./tour-service
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=app
    depends_on:
      - db

  # --- ДОБАВЛЯЕМ ЭТОТ БЛОК ---
  booking-service:
    build: ./booking-service
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=app
    depends_on:
      - db
      - user-service
      - tour-service
  # ---------------------------

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: