version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    image: ghcr.io/egortonkikh/travelhub-user-service:latest
    build: ./user-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=app
    depends_on:
      db:
        condition: service_healthy

  tour-service:
    image: ghcr.io/egortonkikh/travelhub-tour-service:latest
    build: ./tour-service
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=app
    depends_on:
      db:
        condition: service_healthy

  booking-service:
    image: ghcr.io/egortonkikh/travelhub-booking-service:latest
    build: ./booking-service
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: