server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: User Service
    location /api/users {
        rewrite ^/api/users(.*)$ /users$1 break;
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API: Tour Service
    location /api/tours {
        rewrite ^/api/tours(.*)$ /tours$1 break;
        proxy_pass http://tour-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API: Booking Service
    location /api/bookings {
        rewrite ^/api/bookings(.*)$ /bookings$1 break;
        proxy_pass http://booking-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
